<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="register.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.0.1/css/all.min.css" integrity="sha512-2SwdPD6INVrV/lHTZbO2nodKhrnDdJK9/kg2XD1r9uGqPo1cUbujc+IYdlYdEErWNu69gVcYgdxlmVmzTWnetw==" crossorigin="anonymous" referrerpolicy="no-referrer" />
</head>
<body>
    <main class="container">
        <form >
            <div class="text-sign-up">
                <h1>Sign up</h1>
                <p id="text1">sign up to continue</p>
            </div>
            <div class="container">
                <div class="input-box">
                    <i class="fa-solid fa-face-smile"></i>
                    <input id="Namebox" placeholder="Name" type="text">
                </div>
                <div class="input-box">
                    <i class="fa-regular fa-user"></i>
                    <input id="Userbox" placeholder="User" type="email">
                </div>
                <div class="input-box">
                    <input id="Passwordbox" placeholder="Password" type="password">
                    <button class="icon-button">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
                <div class="input-box">
                    <input id="ConfirmPasswordbox" placeholder="Confirm Password" type="password">
                    <button class="icon-button">
                        <i class="fa-solid fa-eye-slash"></i>
                    </button>
                </div>
                <div class="login-button">
                    <a href="page1.html">
                        <button id="button2">Register</button>
                    </a>
                </div>
            </div>
        </form>
    </main>
    
</body>
</html>
