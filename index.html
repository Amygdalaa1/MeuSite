<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="index.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login</title>
</head>
<body>
    <main class="container">
        <form>
            <h1>Login</h1>
            <div class="container">
                <div class="input-box">
                    <input id="Userbox" placeholder="User" type="email">
                </div>
                <div class="input-box">
                    <input id="Passwordbox" placeholder="Password" type="password">
                </div>
                <div class="login-button">
                    <a href="page1.html">
                        <button id="button1">Login</button>
                    </a>
                </div>
                <div class="account-text">
                    <p id="noaccount">Dont have an account?</p>
                    <a id=clickhere href="register.html">Register</a>
                </div>
            </div>
        </form>
    </main>
    
</body>
</html>
